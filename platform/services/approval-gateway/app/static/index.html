<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    内容安全策略（安全专项）：审批台的每个字段（阶段名、需求文本、证据链接、AI 自审）
    都来自 AI 与用户输入。XSS 修复做两层：
      ① 所有插值经 esc() 转义（app.js）；
      ② 本 CSP 把"万一漏了一处"的爆炸半径压到最小——
         script-src 'self' 意味着**内联脚本与内联事件处理器一律不执行**，
         所以本页没有 onclick="" 属性，改用 data-* + 事件委托。
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>平台审批台</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>平台审批台</h1>
    <span class="badge">Phase 0</span>
    <span id="version" class="version"></span>
    <span id="posture" class="posture" hidden></span>
  </header>
  <main>
    <section class="panel">
      <h2>待审批（<span id="count">0</span>）</h2>
      <div id="list"><div class="empty">加载中…</div></div>
    </section>
    <section class="panel">
      <h2>审批详情</h2>
      <div id="detail"><div class="empty">点击左侧审批单查看</div></div>
    </section>
  </main>
  <div id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
