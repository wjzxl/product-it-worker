# E1 工程闸门：动手之前（Pre-Implementation Gate）
#
# 对应《从 vibe coding 到 FDE 交付》图 40：即使五项中已有四项通过，只要「影响哪些已有接口」
# 这类关键项不明，就不应开始修改——关键未知不能用多数通过抵消。
#
# 判定者是代码（app/gate_rules.py），不是提示词：`mode: block` 时存在缺口即阻断推进。
# 灰度：ENG_GATES_MODE=off|warn|block 可全局降级（默认 warn，见计划 §7）。
code: E1
title: 动手之前
version: "1"
mode: block
description: >
  在生成/修改代码之前检查"是否具备安全实施条件"：需求依据、引用规则、改动对象、
  影响范围、回滚方式。任一项缺失都应补齐后再动手，而不是先写一版再让业务承受返工。

checks:
  - id: requirement_basis
    ask: 本次需求的已确认依据（PRD 链接 + 来源条目）
    require: all_of
    keys: ["prd_ref", "sources"]
    severity: major
    hint: 先走产品域澄清，把需求与出处固化后再进入实现

  - id: source_provenance
    ask: 需求来源链（谁、何时、在哪句话里提出的）
    require: source_present
    severity: major
    hint: 用 /requirements/{task_ref}/provenance 反查并补齐出处

  - id: change_targets
    ask: 本次要改动哪些文件/模块
    require: non_empty
    keys: ["change_targets"]
    severity: major
    hint: 列出拟改动的文件与函数，避免"顺手重写无关文件"

  - id: impact_scope
    ask: 会影响哪些已有接口/表/任务（含调用方）
    require: non_empty
    keys: ["impact_scope"]
    severity: critical
    hint: 答不上来就停下——这是课程图 40 明确要求阻断的那一项

  - id: rollback_plan
    ask: 回滚方式与回滚后的验证口径
    require: non_empty
    keys: ["rollback_plan"]
    severity: major
    hint: 提供可执行的回滚步骤与验证方法（如保留上一版本、一键切回）
