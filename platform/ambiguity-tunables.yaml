# 模糊度检测可调项（B1/B2/B4）——业务侧唯一需要维护的文件
#
# 为什么单独放一个文件：词表是"业务方言"，会随团队说话习惯变化；
# 放在这里改完即生效（mtime 热更新），不必动代码、不必发版。
#
# 用法：
#   B1「已经够了」——这些表述在你们业务里已有明确 SOP/惯例，不该反复追问 → 抑制（不报）
#   B2「还要补」  ——你们高频但通用词表没覆盖的模糊话 → 追加为待确认问题
#   B4 容忍度     ——prefer: miss（宁可少报，怕打扰业务方）/ report（宁可多报，怕漏口径）
version: 1
prefer: miss          # 默认宁可少报；若你们更怕漏口径，改成 report

# B1：命中这些词就不再报（示例，请按你们实际 SOP 增删）
already_specified:
  # - "按常规处理"        # ← 若你们《研发规范》里已定义"常规处理"，取消注释即可
  # - "跟老系统保持一致"   # ← 若老系统行为有权威文档，同理

# B2：你们业务高频、但通用词表没覆盖的模糊表述
extra_patterns:
  - id: precedent_vague
    pattern: "按上次那样|跟上一次一样|照上次的来|和之前那个一样"
    why: "「按上次那样」没有指认具体依据：上次的方案可能已过期或场景不同"
    question: "「上次」指的是哪一次交付？请给出链接或版本号"
    suggested_defaults: ["引用具体交付物链接，而不是口头指代"]
  - id: legacy_parity_vague
    pattern: "跟老系统(保持)?一致|和老系统(保持)?一样|与老系统对齐|保持原有逻辑|兼容老逻辑"
    why: "老系统行为未必有文档；「保持一致」在无对照物时无法验收"
    question: "以哪个环境/版本的哪个行为为准？能否给出对照样例？"
    suggested_defaults: ["以现网 v1 的导出行为为准，差异逐条列出"]
  - id: protoype_vague
    pattern: "先做一版|做个初版|先看看效果|先出来再说"
    why: "「先做一版」把范围与验收推迟到实现阶段，等于没有范围"
    question: "这一版的最小可验收范围是什么？哪些明确不做？"
    suggested_defaults: ["本版只做只读展示，导出与权限下一版"]
  - id: effort_vague
    pattern: "这个简单|改动不大|小改动|顺手改一下"
    why: "「简单」是工作量判断而非需求描述，容易掩盖影响面"
    question: "涉及哪些文件/接口？影响面评估是什么？"
    suggested_defaults: ["按工程闸门 E1 的影响范围清单逐项确认"]
  - id: implicit_auto_vague
    pattern: "自动处理|自动判断|智能化处理|AI 自动"
    why: "「自动」没有定义触发条件、兜底与人工介入点"
    question: "触发条件是什么？判断错误时的兜底与人工介入点在哪？"
    suggested_defaults: ["自动生成候选，人工确认后生效"]
