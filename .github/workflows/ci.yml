name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WP0：补齐全部 7 个服务（此前漏了 metrics-dashboard 与 process-mining，
        # 其 46 项测试从未在 CI 运行过）
        service:
          - approval-gateway
          - gitlab-bridge
          - task-center
          - agent-runtime
          - knowledge-base
          - metrics-dashboard
          - process-mining
    defaults:
      run:
        working-directory: platform/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  # 规则即代码：工程闸门规则必须在**不启动服务**的情况下就能被校验
  # （否则规则写错只能等线上拦截时才发现）——见 17 号计划 WP2
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install (approval-gateway deps)
        working-directory: platform/services/approval-gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 工程闸门规则自检
        working-directory: platform
        run: python scripts/check_gates.py --selftest
      - name: 项目规则包校验
        working-directory: platform
        run: python scripts/check_project_rules.py

  # 治理体检：鉴权覆盖、鉴权模块漂移、部署档位——都是纯标准库脚本，不需要装依赖。
  # 这些检查此前只存在于仓库里、没有任何地方会跑它们，等于没有。
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: 端点鉴权清点（无鉴权写接口必须为 0）
        working-directory: platform
        run: python scripts/audit_endpoint_auth.py --strict
      - name: 服务间鉴权模块无漂移
        working-directory: platform
        run: python scripts/sync_service_auth.py --check
      - name: 部署档位体检（自检：prod 该拦的必须拦）
        working-directory: platform
        run: python scripts/check_deployment_readiness.py --selftest
      - name: 生产档位模板必须是"可上线"的
        working-directory: platform
        run: python scripts/check_deployment_readiness.py --env-file .env.prod.example
      - name: 生产配置生成器自检（密钥必须真的被生成、占位值必须被拦）
        working-directory: platform
        run: python scripts/init_prod_env.py --selftest
      - name: 备份/恢复脚本自检（无 docker 时必须明确报 INVALID）
        working-directory: platform
        run: python scripts/backup_restore.py --selftest
      - name: 健康看门狗自检（判级、去重、通知送达）
        working-directory: platform
        run: python scripts/watch_health.py --selftest

  # 迁移体检：模型改了没补迁移必须红。需要 alembic（在 approval-gateway 的依赖里）
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install
        working-directory: platform/services/approval-gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 模型与迁移零漂移 + 空库可建 + 可回滚
        working-directory: platform
        run: python scripts/check_migrations.py --selftest
