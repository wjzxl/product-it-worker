# 可观测组件（Phase 0 验收用自托管版；生产可用 Langfuse Cloud 免费版替代）
# 用法：docker compose -f docker-compose.observability.yml up -d
services:
  langfuse-db:
    image: postgres:16-alpine
    container_name: platform-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    ports:
      - "5433:5432"
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: platform-langfuse
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: phase0-dev-secret-change-me
      SALT: phase0-dev-salt-change-me
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy

volumes:
  langfuse_db:
