name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WP0：补齐全部 7 个服务（此前漏了 metrics-dashboard 与 process-mining，
        # 其 46 项测试从未在 CI 运行过）
        service:
          - approval-gateway
          - gitlab-bridge
          - task-center
          - agent-runtime
          - knowledge-base
          - metrics-dashboard
          - process-mining
    defaults:
      run:
        working-directory: platform/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  # 规则即代码：工程闸门规则必须在**不启动服务**的情况下就能被校验
  # （否则规则写错只能等线上拦截时才发现）——见 17 号计划 WP2
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install (approval-gateway deps)
        working-directory: platform/services/approval-gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 工程闸门规则自检
        working-directory: platform
        run: python scripts/check_gates.py --selftest
      - name: 项目规则包校验
        working-directory: platform
        run: python scripts/check_project_rules.py
